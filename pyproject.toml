[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-neutrophil-project"
version = "0.1.0"
description = "CLI-oriented Python project skeleton for blood smear image analysis focused on neutrophils."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Project Maintainer" }
]
dependencies = [
  "albumentations>=1.4,<3.0",
  "numpy>=1.26,<3.0",
  "opencv-python>=4.9,<5.0",
  "pandas>=2.2,<3.0",
  "Pillow>=10.0,<12.0",
  "PyYAML>=6.0,<7.0",
  "scikit-image>=0.22,<1.0",
  "scikit-learn>=1.4,<2.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "tqdm>=4.66,<5.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
